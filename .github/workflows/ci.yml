name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.5"
      - run: flutter --version
      - run: flutter pub get
      # Format check is informational: dart format across Flutter SDK versions
      # can produce whitespace-only diffs that don't reflect intent. flutter
      # analyze (below) is the real quality gate — it enforces our lints.
      - run: dart format --output=none .
      - run: flutter analyze
      - run: flutter test
